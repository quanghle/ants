[package]
name = "ants-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "What a human's client derives from what it reads and sends, with no I/O, and its reads and writes over a transport"

[dependencies]
ants-proto.workspace = true
chrono = { workspace = true, features = ["std", "serde"] }
data-encoding.workspace = true
# The one-off X25519 key a registration's answers are sealed to: nkeys makes none itself on wasm32, so its bytes come
# from getrandom, which takes them from the browser there (ants-proto turns that on).
getrandom = "0.2.17"
nkeys = { workspace = true, features = ["xkeys"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }

[lints]
workspace = true
