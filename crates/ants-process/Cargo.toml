[package]
name = "ants-process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The wait for a child process the daemon and the trail runner share, on macOS by a kqueue of its own"

[dependencies]
tokio = { workspace = true, features = ["process"] }

# kqueue for the exit of a child (crate::exit).
[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "event", "process"] }
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
