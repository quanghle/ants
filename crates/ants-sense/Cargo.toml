[package]
name = "ants-sense"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "sense, ants' built-in identity, memory and work provider, run inside the daemon"

[dependencies]
ants-proto.workspace = true
chrono = { workspace = true, features = ["clock", "serde"] }
data-encoding.workspace = true
# Already in the binary through async-nats: the sanitizer's secret shapes (crate::sanitize).
regex = "1.13.1"
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
# The version nkeys already brings in, through ed25519-dalek.
sha2 = { version = "0.11.1", default-features = false }
thiserror = "2.0.21"
tokio = { workspace = true, features = ["fs", "io-util", "sync"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v7"] }

[features]
# The fixtures of its tests ([`testing`](src/testing.rs)), shared with the tests of the daemon's sense module.
test-support = []

[dev-dependencies]
ants-test-support.workspace = true
nkeys = "0.4.5"
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
