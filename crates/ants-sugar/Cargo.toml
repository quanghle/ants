[package]
name = "ants-sugar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "sugar, ants' built-in identity, memory and work provider, run inside the daemon"

[dependencies]
ants-proto.workspace = true
chrono = { workspace = true, features = ["clock", "serde"] }
data-encoding.workspace = true
# Already in the binary through async-nats: the sanitizer's secret shapes (crate::sanitize).
regex = "1.13.1"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
# The version nkeys already brings in, through ed25519-dalek.
sha2 = { version = "0.10.9", default-features = false }
thiserror = "2.0.21"
tokio = { workspace = true, features = ["sync"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
ants-test-support.workspace = true
nkeys = "0.4.5"
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
