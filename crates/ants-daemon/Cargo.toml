[package]
name = "ants-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The ant daemon: JetStream inbox consumer and ACP harness pool"

[dependencies]
agent-client-protocol = { workspace = true, features = ["process", "unstable_end_turn_token_usage", "unstable_session_fork"] }
ants-proto.workspace = true
ants-sense.workspace = true
anyhow.workspace = true
async-nats = { workspace = true, features = ["ring", "jetstream", "kv", "nkeys", "websockets", "nuid", "server_2_10", "server_2_11", "server_2_12", "server_2_14"] }
chrono = { workspace = true, features = ["clock"] }
crypto_secretbox = { version = "0.1.1", default-features = false, features = ["alloc", "getrandom", "salsa20"] }
data-encoding.workspace = true
futures.workspace = true
# Copilot CLI's server protocol (crate::harness::native::copilot), without features: no bundled CLI, TLS or HTTP. Pinned
# exactly, the SDK and the CLI agreeing on a protocol version; SDK_VERSION in copilot.rs names it.
github-copilot-sdk = { version = "=1.0.29", default-features = false }
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
jiff = { version = "0.2.39", default-features = false, features = ["std", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
nkeys = { version = "0.4.5", features = ["xkeys"] }
ring = "0.17.14"
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "process", "io-util", "io-std", "net", "sync", "time", "signal", "fs"] }
toml.workspace = true
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }
tower-service = "0.3.3"
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

# Stopping a native harness CLI with the processes it started (crate::harness::native), as agent-client-protocol does
# for ACP harnesses.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

# The keychain holding NKey seeds (crate::keystore), rustls-native-certs already bringing it in; sysctl for the memory
# available (crate::pressure).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
security-framework = { version = "3.7.0", default-features = false }

# The Windows Credential Manager holding NKey seeds (crate::keystore), the MCP pipe's access list (crate::ipc) and the
# memory available (crate::pressure).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
ants-test-support.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }

[lints]
workspace = true
