[package]
name = "ants-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The persona daemon: JetStream inbox consumer and ACP harness pool"

[dependencies]
agent-client-protocol = { version = "5.2.0", features = ["process"] }
ants-proto = { path = "../ants-proto" }
anyhow = "1.0.104"
async-nats = { version = "0.52.0", default-features = false, features = ["ring", "jetstream", "kv", "nkeys", "websockets", "nuid", "server_2_10", "server_2_11", "server_2_12", "server_2_14"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures = "0.3.34"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
rmcp = { version = "3.10.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "process", "io-util", "io-std", "net", "sync", "time", "signal", "fs"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
tower-service = "0.3.3"
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
rmcp = { version = "3.10.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
