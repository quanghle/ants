# The built-in harness definitions. A config file's [harnesses.<name>] table of the same name replaces one whole.
# `sign_in` is the command a human runs when the harness reports it is not signed in. `rate_limited` and
# `quota_exhausted` add phrases of the harness's errors that mean a provider rate limit or an exhausted quota to the
# common ones (HTTP 429/529, "rate limit", "overloaded", "quota exceeded", "usage limit" and the like).
# `context_overflow` lists phrases of its prompt errors that mean the session outgrew the model's context window,
# besides those every harness shares. `window` is the model's context window in tokens, when known, and
# `history_budget` the bytes of the thread's history a rebuilt session is seeded with; a `context` value may set
# either over the harness's. Unset, the budget is a twelfth of the window (at 4 bytes a token), else 64 KiB, and no
# budget exceeds a quarter of the window.
#
# Every built-in runs in its most permissive native setting, through `args` or `mode`, and so runs its own tools
# without asking ants: `bypass_permissions` says so, and makes the daemon and `ants doctor` warn of allow rules and
# tool narrowing that cannot reach those tools. A [harnesses.<name>] table redefining one with a gated mode (such as
# `mode = "default"`) and without `bypass_permissions` sends its tool requests to ants again.

# GitHub Copilot CLI. A failed prompt ends as a reply, `Error: Failed to get response from the AI model; retried 5
# times (...) Last error: 429 ...`. Its weekly rate limit lasts days, so it counts as a quota.
# `--allow-all` allows every tool, path and URL; sessions stay in the agent mode, not the experimental autopilot.
[harnesses.copilot]
command = "copilot"
args = ["--acp", "--allow-all"]
bypass_permissions = true
sign_in = "copilot login"
quota_exhausted = [
    "premium request",
    "ai credits",
    "weekly rate limit",
    "used all your copilot free",
    "free_tier_limit",
    "overage_limit",
    "spend_limit_reached",
]
context_overflow = ["model_max_prompt_tokens_exceeded", "prompt token count of"]

[harnesses.copilot.context]
default = { args = ["--context", "default"] }
long_context = { args = ["--context", "long_context"] }

# Claude Code through its ACP adapter, npm @agentclientprotocol/claude-agent-acp. Sign-in: `claude login`, or
# ANTHROPIC_API_KEY. Sessions are switched to `bypassPermissions`, which the adapter offers only when not run as root
# (unless IS_SANDBOX=1) and not disabled by the Claude Code settings' `disableBypassPermissionsMode`. A failed prompt
# is an ACP error with an `errorKind`: `You've hit your 5-hour limit · resets 6:43am`, `API Error: Request rejected
# (429) · ...`, `Credit balance is too low` (`billing_error`).
[harnesses.claude]
command = "claude-agent-acp"
mode = "bypassPermissions"
bypass_permissions = true
sign_in = "claude login"
quota_exhausted = [
    "hit your",
    "you've reached your",
    "out of usage",
    "out of extra usage",
    "doesn't include usage",
    "doesn't include extra usage",
    "usage allocation has been disabled",
    "usage limit is set to $0",
    "requires usage credits",
    "spend limit",
    "billing_error",
]
context_overflow = ["exceed context limit"]
window = 200000

[harnesses.claude.context]
default = {}
1m = { model_suffix = "[1m]", window = 1000000 }

# Codex through its ACP adapter, npm @agentclientprotocol/codex-acp, which bundles @openai/codex. Sign-in: `codex-acp
# login`, or CODEX_API_KEY or OPENAI_API_KEY with DEFAULT_AUTH_REQUEST = '{"methodId":"api-key"}' in `env`. Sessions
# are switched to `agent-full-access`: no approvals, no sandbox. It reports tokens but no cost.
[harnesses.codex]
command = "codex-acp"
mode = "agent-full-access"
bypass_permissions = true
sign_in = "codex-acp login"

# Google Antigravity CLI. Sign-in: `agy` once (or `agy acp --login`), or a Gemini API key.
# `--dangerously-skip-permissions` approves every tool request. No context selector: the model chooses the native
# window. A failed prompt ends as a reply of `⚠ API error (attempt N): Error 429, Message:
# ..., Status: RESOURCE_EXHAUSTED` lines and `⚠ Agent execution terminated due to error.`
[harnesses.antigravity]
command = "agy"
args = ["acp", "--disable-telemetry", "--dangerously-skip-permissions"]
bypass_permissions = true
sign_in = "agy"
quota_exhausted = ["daily quota", "ai credits balance is too low"]
context_overflow = ["exceeds the maximum number of tokens allowed"]
