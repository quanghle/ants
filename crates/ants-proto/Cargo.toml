[package]
name = "ants-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The ants wire contract: message envelope, subjects, stream and bucket names"

[dependencies]
chrono = { workspace = true, features = ["clock", "std", "serde"] }
data-encoding.workspace = true
nkeys = "0.4.5"
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10.9", default-features = false }
thiserror = "2.0.21"
uuid = { workspace = true, features = ["v4", "v7", "serde"] }

[dev-dependencies]
insta = { version = "1.49.0", default-features = false, features = ["json"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
