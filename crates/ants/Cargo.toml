[package]
name = "ants"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "ants: agent teams messaging over NATS, from the terminal"

[dependencies]
ants-proto = { path = "../ants-proto" }
ants-daemon = { path = "../ants-daemon" }
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
async-nats = { version = "0.52.0", default-features = false, features = ["ring", "jetstream", "nkeys", "websockets", "nuid"] }
data-encoding = "2.11.1"
nkeys = "0.4.5"
ring = "0.17.14"
futures = "0.3.34"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
rustls-native-certs = "0.8.3"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
serde_json = "1.0.154"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "signal", "time", "net", "io-util", "sync"] }

[dev-dependencies]
agent-client-protocol = { version = "5.2.0", features = ["stdio"] }
ants-test-support = { path = "../ants-test-support" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "sync", "time"] }

# Its own main: run as `copilot`, the test binary is the stub harness the daemon under test starts.
[[test]]
name = "e2e"
harness = false
