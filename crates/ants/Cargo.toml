[package]
name = "ants"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "ants: agent teams messaging over NATS, from the terminal"

[dependencies]
ants-proto.workspace = true
ants-daemon = { path = "../ants-daemon" }
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
async-nats = { workspace = true, features = ["ring", "jetstream", "nkeys", "websockets", "nuid"] }
data-encoding.workspace = true
nkeys = "0.4.5"
ring = "0.17.14"
futures.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rustls-native-certs = "0.8.3"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tokio = { workspace = true, features = ["rt", "macros", "signal", "time", "net", "io-util", "sync", "process"] }

[dev-dependencies]
agent-client-protocol = { workspace = true, features = ["stdio"] }
ants-test-support.workspace = true
chrono = { workspace = true, features = ["clock"] }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }


[lints]
workspace = true

# Its own main: run as `copilot`, the test binary is the stub harness the daemon under test starts.
[[test]]
name = "e2e"
harness = false
