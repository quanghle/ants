[package]
name = "ants"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "ants: agent teams messaging over NATS, from the terminal"

[dependencies]
ants-proto.workspace = true
ants-client.workspace = true
ants-sense.workspace = true
ants-trail.workspace = true
ants-daemon = { path = "../ants-daemon" }
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
async-nats = { workspace = true, features = ["ring", "jetstream", "nkeys", "websockets", "nuid"] }
data-encoding.workspace = true
nkeys = { version = "0.4.5", features = ["xkeys"] }
ring = "0.17.14"
futures.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
jiff = { version = "0.2.39", default-features = false, features = ["std", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
rustls-native-certs = "0.8.3"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tokio = { workspace = true, features = ["rt", "macros", "signal", "time", "net", "io-util", "sync", "process"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
scrypt = { version = "0.12.0", default-features = false }
crypto_secretbox = { version = "0.1.1", default-features = false, features = ["alloc", "getrandom", "salsa20"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
unicode-width = "0.2.3"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[features]
# Embed the page of the web client, served by `ants web` and written by `ants web export`: the bundle scripts/web.sh
# puts in target/web, checked against web.sha256 (build.rs). Release builds turn it on; without it, a build needs
# neither the bundle nor Node.
web = ["dep:ring"]

[build-dependencies]
ring = { version = "0.17.14", optional = true }

[dev-dependencies]
agent-client-protocol = { workspace = true, features = ["stdio"] }
ants-test-support.workspace = true
chrono = { workspace = true, features = ["clock"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "test-util"] }


[lints]
workspace = true

# Its own main: run as `copilot`, the test binary is the stub harness the daemon under test starts.
[[test]]
name = "e2e"
harness = false

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
