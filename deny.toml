# cargo-deny configuration: `cargo deny check` (CI runs it on every push and pull request).

[graph]
all-features = true

[advisories]
# Every advisory (vulnerability, unmaintained, unsound, notice) in the RustSec database fails the check; ignore one
# here, with a reason, only after review.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# The licenses found in the dependency tree, all permissive. A new one fails the check until reviewed and added.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace crates are not published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# OpenSSL stays out: TLS is on rustls.
deny = [
    { crate = "openssl", reason = "TLS stays on rustls" },
    { crate = "openssl-sys", reason = "TLS stays on rustls" },
    { crate = "native-tls", reason = "TLS stays on rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
