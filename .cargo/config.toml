# Dependency cooldown: resolving (cargo update, cargo add, a changed manifest) ignores crate versions published less
# than 7 days ago, unless Cargo.lock already holds them. Builds from the committed Cargo.lock are unaffected. To take a
# newer release on purpose, such as a security fix:
#   CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p CRATE --precise VERSION
[registry]
global-min-publish-age = "7 days"
