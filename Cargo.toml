[workspace]
resolver = "3"
members = ["crates/ants-proto", "crates/ants-daemon", "crates/ants", "crates/ants-test-support"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.100"
publish = false

# Small, lean binaries: one `ants` executable runs on every machine.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
