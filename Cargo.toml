[workspace]
resolver = "3"
members = ["crates/ants-proto", "crates/ants-client", "crates/ants-sense", "crates/ants-process", "crates/ants-trail", "crates/ants-daemon", "crates/ants", "crates/ants-test-support"]

[workspace.package]
edition = "2024"
version = "0.5.0"
license = "MIT"
repository = "https://github.com/quanghle/ants"
rust-version = "1.100"
publish = false

[workspace.dependencies]
agent-client-protocol = "5.2.0"
ants-proto = { path = "crates/ants-proto" }
ants-client = { path = "crates/ants-client" }
ants-sense = { path = "crates/ants-sense" }
ants-process = { path = "crates/ants-process" }
ants-trail = { path = "crates/ants-trail" }
ants-daemon = { path = "crates/ants-daemon" }
ants-test-support = { path = "crates/ants-test-support" }
anyhow = "1.0.104"
async-nats = { version = "0.53.0", default-features = false }
chrono = { version = "0.4.45", default-features = false }
crypto_secretbox = { version = "0.1.1", default-features = false, features = ["alloc", "getrandom", "salsa20"] }
data-encoding = "2.11.1"
futures = "0.3.34"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", default-features = false }
hyper-util = { version = "0.1.20", default-features = false }
jiff = { version = "1.0.1", default-features = false, features = ["std", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
libc = "0.2.191"
nkeys = "0.4.5"
ring = "0.17.14"
rmcp = { version = "3.10.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1.44"
uuid = "1.29.2"
windows-sys = "0.61.2"

[workspace.lints.cargo]
unused_dependencies = "warn"

[workspace.lints.clippy]
# Lint suppressions are `#[expect(lint, reason = "...")]`, which fails once the lint no longer fires. Two crate-level
# allows stay, the `allow(linker_messages)` of crates/ants/src/main.rs and crates/ants-daemon/src/lib.rs: the lint
# fires only where a binary is linked, on macOS, so an expect there is unfulfilled under `cargo check` and
# `cargo clippy`, which link nothing.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
duration_suboptimal_units = "warn"
format_push_string = "warn"
large_futures = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
return_self_not_must_use = "warn"
semicolon_if_nothing_returned = "warn"
too_many_lines = "warn"
undocumented_unsafe_blocks = "warn"

# Small, lean binaries: one `ants` executable runs on every machine.
[profile.release]
lto = false
codegen-units = 1
strip = true
panic = "abort"
