name: Release

# A tag vX.Y.Z (X.Y.Z the workspace version in Cargo.toml) builds the `ants` binary for each target and publishes a
# GitHub Release with the archives, SHA256SUMS and build provenance attestations, once the checks of ci.yml pass. Each
# archive holds the nats-server pinned in crates/ants/nats-server.sha256 beside ants, with its license; ants embeds
# the page of the web client pinned in crates/ants/web.sha256 (scripts/web.sh, the `web` feature). The checks of ci.yml
# rerun here unless CI already passed on the same commit pushed to main. A tag with a pre-release suffix (v0.2.0-rc.1)
# makes a pre-release. The notes come from bd (scripts/release-notes.sh): the
# work closed and requirements added since the previous release, per the committed .bd/issues.jsonl; notes over
# GitHub's 125000-character limit only count the requirements, the full notes attached as release-notes.md. Run by hand
# (workflow_dispatch), it checks and builds only, keeping the archives and notes as workflow artifacts and showing the
# notes in the run summary.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

# Every job's `toolchain:` matches rust-toolchain.toml and `rust-version` in Cargo.toml; the three move together.
jobs:
  version:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    outputs:
      name: ${{ steps.version.outputs.name }}
      ci-passed: ${{ steps.ci.outputs.passed }}
    steps:
      # The whole history and its tags, for the previous release and its bd snapshot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: version
        name: Tag matches the workspace version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ -n "$version" ] || { echo "no version in Cargo.toml" >&2; exit 1; }
          if [ "$REF_TYPE" = tag ]; then
            case "$REF_NAME" in
              "v$version" | "v$version"-*) ;;
              *) echo "tag $REF_NAME does not match version $version in Cargo.toml" >&2; exit 1 ;;
            esac
            name=$REF_NAME
          else
            name=v$version-${GITHUB_SHA::7}
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - id: ci
        name: CI already passed on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&event=push&status=success&per_page=1" --jq .total_count)
          passed=false
          [ "$runs" -eq 0 ] || passed=true
          echo "CI passed on main for $sha: $passed"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

      - name: Release notes
        env:
          REV: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          scripts/release-notes.sh "$REV" > release-notes.md
          mkdir notes
          if [ "$(wc -c < release-notes.md)" -le 125000 ]; then
            cp release-notes.md notes/body.md
          else
            scripts/release-notes.sh --brief "$REV" > notes/body.md
            cp release-notes.md notes/
          fi
          cat notes/body.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/
          if-no-files-found: error

  checks:
    needs: version
    if: needs.version.outputs.ci-passed != 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 26.04: the binaries need glibc 2.43 or later. `nats` is the platform of the nats-server
          # packed with ants, as its releases name it.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-26.04, nats: linux-amd64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-26.04-arm, nats: linux-arm64 }
          - { target: aarch64-apple-darwin, os: macos-26, nats: darwin-arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, nats: windows-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11
        with:
          toolchain: "1.100"
          targets: ${{ matrix.target }}

      # The page of the web client pinned in crates/ants/web.sha256, embedded by the `web` feature. Until the repo
      # ants-web publishes its releases, the page is built only from its checkout beside ants, which a runner has
      # not: scripts/web.sh fails here, and with it the release.
      - name: Web page
        shell: bash
        run: scripts/web.sh

      # No build cache: a release builds from the lock file alone.
      - run: cargo build --release --locked -p ants --features web --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          NAME: ${{ needs.version.outputs.name }}
          TARGET: ${{ matrix.target }}
          NATS: ${{ matrix.nats }}
        run: |
          exe=ants nats=nats-server
          [ "$RUNNER_OS" != Windows ] || exe=ants.exe nats=nats-server.exe
          "target/$TARGET/release/$exe" --version
          "target/$TARGET/release/$exe" web export "$RUNNER_TEMP/web" --server wss://hub.example/nats
          dir=ants-$NAME-$TARGET
          mkdir -p "dist/$dir"
          cp "target/$TARGET/release/$exe" LICENSE README.md "dist/$dir/"
          scripts/nats-server.sh "$NATS" "dist/$dir"
          "dist/$dir/$nats" --version
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip -bso0 "$dir.zip" "$dir"
          else
            tar -czf "$dir.tar.gz" "$dir"
          fi
          rm -r "$dir"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    # A skipped `checks` (CI already passed) would otherwise skip this job too.
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref_type == 'tag'
      && needs.version.result == 'success' && needs.build.result == 'success'
      && (needs.checks.result == 'success' || needs.checks.result == 'skipped')
    needs: [version, checks, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.name }}
        run: |
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          full=
          [ ! -f notes/release-notes.md ] || full=notes/release-notes.md
          gh release create "$TAG" dist/* $full --repo "$GITHUB_REPOSITORY" --verify-tag --title "ants $TAG" \
            --notes-file notes/body.md $prerelease
