name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, for advisories published since the last change.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Lint warnings (rustc and clippy) fail `cargo clippy`, `cargo test` and `cargo build`. Set here rather than in
  # .cargo/config.toml so local builds keep warnings non-fatal while editing.
  CARGO_BUILD_WARNINGS: deny
  NATS_SERVER_VERSION: v2.15.3

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11
        with:
          toolchain: "1.100"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Tests that need nats-server skip without it, except under ANTS_REQUIRE_TOOLS=1 (set for `cargo test`
      # below), where they fail: a broken install must not pass as skipped tests.
      - name: Install nats-server
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) target=linux-amd64 ;;
            Linux-aarch64) target=linux-arm64 ;;
            Darwin-arm64) target=darwin-arm64 ;;
            Darwin-x86_64) target=darwin-amd64 ;;
            *) echo "unsupported runner: $(uname -sm)" >&2; exit 1 ;;
          esac
          name=nats-server-$NATS_SERVER_VERSION-$target
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/$NATS_SERVER_VERSION/$name.tar.gz" \
            | tar xz -C "$HOME/.local/bin" --strip-components=1 "$name/nats-server"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets
      - run: cargo test
        env:
          ANTS_REQUIRE_TOOLS: "1"
      - run: cargo build --release

      - name: Footprint (idle antsd under 20 MB RSS)
        run: scripts/footprint.sh --ants target/release/ants --port 14722 --max-mb 20

  # Licenses, security advisories, banned crates and sources, as configured in deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11
        with:
          toolchain: "1.100"

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2

      - run: cargo deny --locked check
